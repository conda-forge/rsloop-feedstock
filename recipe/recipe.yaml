schema_version: 1

context:
  version: "0.1.68"

package:
  name: rsloop
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/r/rsloop/rsloop-${{ version }}.tar.gz
    sha256: fd35b3107c231d313f1992fd01e0a505e28d97853552dc75e37e11b0b3761660

build:
  number: 0
  script:
    env:
      # The CMake builder keeps jitterentropy's -O0 after conda's CFLAGS.
      AWS_LC_SYS_CMAKE_BUILDER: "1"
      CMAKE_GENERATOR: Ninja
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - python
    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('rust') }}
    # allocator_api was stabilized in Rust 1.100.
    - rust >=1.100
    - cmake
    - ninja
    - if: win
      then: nasm
    - cargo-bundle-licenses
    - maturin
  host:
    - maturin >=1.9.4,<2
    - pip
    - python
  run:
    - python

tests:
  - python:
      imports: rsloop
      pip_check: true

about:
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  homepage: https://rustedbytes.github.io/rsloop
  repository: https://github.com/RustedBytes/rsloop
  summary: An event loop for asyncio written in Rust.

extra:
  recipe-maintainers:
    - davidbrochart
